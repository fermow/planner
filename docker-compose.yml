
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celestial-desk-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - celestial_data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000:/run/user/1000:rw
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Tehran
      - LOG_LEVEL=INFO
      - DISPLAY=${DISPLAY:-:0}
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - HOME=/root
      - XDG_RUNTIME_DIR=/run/user/1000
      - OLLAMA_HOST=http://192.168.40.121:11434
      - OLLAMA_KEEP_ALIVE=0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - celestial-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: celestial-desk-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3030:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - celestial-net
    profiles:
      - prod

  frontend-dev:
    image: node:20-alpine
    container_name: celestial-desk-frontend-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm run dev"
    ports:
      - "3030:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - celestial-net

volumes:
  celestial_data:
    driver: local
    driver_opts:
      type: none
      device: /home/mobinabedian/celestial-desk-data
      o: bind

networks:
  celestial-net:
    driver: bridge
