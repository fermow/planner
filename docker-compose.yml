
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celestial-desk-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - celestial-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: celestial-desk-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3030:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - celestial-net
    profiles:
      - prod

  frontend-dev:
    image: node:20-alpine
    container_name: celestial-desk-frontend-dev
    restart: unless-stopped
    working_dir: /app
    # Keep dependencies in a named volume. Reinstalling them at every boot
    # leaves port 3030 open without an HTTP server for several minutes.
    command: sh -c "test -d node_modules/vite || npm ci && exec npm run dev"
    ports:
      - "3030:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - celestial-net

networks:
  celestial-net:
    driver: bridge

volumes:
  frontend-node-modules:
