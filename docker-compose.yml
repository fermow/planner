
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: celestial-desk-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - celestial-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: celestial-desk-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3030:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - celestial-net
    profiles:
      - prod

  frontend-dev:
    image: node:20-alpine
    container_name: celestial-desk-frontend-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3030:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - celestial-net

networks:
  celestial-net:
    driver: bridge
